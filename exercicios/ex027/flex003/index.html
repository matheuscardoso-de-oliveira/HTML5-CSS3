<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.conteiner{
            display: flex;
            /*flex-direction: row;
            flex-wrap: nowrap;*/
            flex-flow: column wrap;
            background-color: lightsalmon;
            height: 30vh;

        }
        div.item{
            flex: auto ;
            background-color: lightskyblue;
            border:1px solid black;
            text-align: center;
        }
       
    </style>
</head>

    <body>
        <div class="conteiner">
            <div class="item">Exmplo de bloco A</div>
            <div class="item">Exmplo de bloco B</div>
            <div class="item">Exmplo de bloco C</div>
            <div class="item">Exmplo de bloco D</div>
            <div class="item">Exmplo de bloco F</div>
            <div class="item">Exmplo de bloco G</div>
        </div>
    </body>
    

</html>
