<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.conteiner{
            display: flex;
            flex-flow: row wrap-reverse;
            align-content: center;
            background-color: lightsalmon;
            height: 95vh;
            width: 80vw;
            margin:auto;
        }
        div.item{
            background-color: lightskyblue;
            border:1px solid black;
            text-align: center;
            flex-basis: 20%;
            height: 75vh;
        }
       
        div#cxA {
               flex-grow: 3;
               flex-shrink:10;    
                min-width: 15vw;
                max-width: 50px;
        }
        div#cxB {
            flex-grow: 20;
            flex-shrink: 1; 
            min-width: 50vw;
        }
        div#cxC {
            flex-grow: 1;
            flex-shrink:15; 
        } 
    
        div#cxC {
     
            align-self: flex-start;
            height: 5%;
            min-height: 20px;
        }
    </style>
</head>

    <body>
        <div class="conteiner">
            <div class="item" id="cxA">A</div>
            <div class="item" id="cxB">B</div>
            <div class="item" id="cxC">C</div>
            
        </div>
    </body>
    

</html>
